# Writes one tailored resume when a student clicks "Write tailored resume" in the app.
# The free web server can't hold CrewAI in memory, so this runs on GitHub's machines instead.
name: Write resume

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "Job match to write a resume for"
        required: true

run-name: Write resume for ${{ inputs.match_id }}

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/cache@v4
        with:
          path: backend/.models
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - env:
          MATCH_ID: ${{ inputs.match_id }}
        run: python -m scripts.write_resume --match-id "$MATCH_ID"
